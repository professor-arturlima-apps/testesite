<div id="videoModal" style="display:none; position:fixed; top:10%; left:10%; width:80%; height:80%; background:white; z-index:9999; border:2px solid #333;">
  <button onclick="document.getElementById('videoModal').style.display='none'" style="position:absolute; right:0; top:0; z-index:10000; padding:10px;">Fechar</button>
  <iframe id="modalFrame" src="" width="100%" height="100%"></iframe>
</div>

<script>
  function abrirVideo(url) {
    document.getElementById('modalFrame').src = url;
    document.getElementById('videoModal').style.display = 'block';
  }
</script>
